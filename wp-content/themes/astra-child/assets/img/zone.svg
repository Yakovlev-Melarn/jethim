<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="zone-title zone-desc">
<title id="zone-title">Зона выезда JetHim: Москва и Московская область</title>
<desc id="zone-desc">Схема: в пределах 10 км от МКАД выезд бесплатный, дальше 45 рублей за километр. Выезжаем по всей Москве и области.</desc>
<rect width="800" height="600" fill="#fbf6f0" rx="16"/>
<circle cx="400" cy="250" r="205" fill="#eef4f8" stroke="#c8d2dc" stroke-width="2"/>
<circle cx="400" cy="250" r="160" fill="#ffffff" stroke="#0b6e99" stroke-width="3"/>
<circle cx="400" cy="250" r="6" fill="#1f2a33"/>
<text x="400" y="280" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2a33">Москва</text>
<text x="568" y="244" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0b6e99">МКАД</text>
<text x="613" y="264" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#3e4854">10 км — выезд бесплатно</text>
<text x="400" y="489" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1f2a33">Дальше 10 км от МКАД — 45 ₽/км</text>
<rect x="40" y="522" width="720" height="62" rx="12" fill="#ffffff" stroke="#c8d2dc"/>
<rect x="62" y="542" width="22" height="22" rx="5" fill="#0b6e99" fill-opacity="0.18" stroke="#0b6e99" stroke-width="2"/>
<text x="96" y="549" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2a33">Выезд по всей Москве и Московской области</text>
<text x="96" y="569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#3e4854">Без ограничений по направлению: любой район и город области.</text>
</svg>
